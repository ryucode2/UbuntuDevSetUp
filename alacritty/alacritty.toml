# ~/.config/alacritty/alacritty.toml

[general]
#ilive_config_reload = true
#import = ["~/.config/alacritty/themes/github_dark_high_contrast.yml"]

[window]
opacity = 0.85
decorations = "buttonless"
dynamic_padding = false

[window.padding]
x = 6
y = 4

[font]
normal.family = "FiraCode Nerd Font"
size = 12.0

[cursor]
style = "Beam"

[colors]
[colors.primary]
background = "#282828"
foreground = "#ebdbb2"
[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"
[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
[terminal.shell]
program = "/usr/bin/zsh"
args = ["--login"]
