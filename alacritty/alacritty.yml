# ~/.config/alacritty/alacritty.yml
# TokyoNight theme for Alacritty (matches LazyVim + Zsh + Tmux)

# --- Font ---
font:
  normal:
    family: "FiraCode Nerd Font"
    style: Regular
  bold:
    family: "FiraCode Nerd Font"
    style: Bold
  italic:
    family: "FiraCode Nerd Font"
    style: Italic
  bold_italic:
    family: "FiraCode Nerd Font"
    style: Bold Italic
  size: 12.0

# --- Window ---
window:
  padding:
    x: 6
    y: 6
  opacity: 0.85   # 85% transparency
  dynamic_padding: true
  decorations: full

# --- Colors (TokyoNight Storm) ---
colors:
  primary:
    background: '0x1a1b26'
    foreground: '0xc0caf5'

  normal:
    black:   '0x15161e'
    red:     '0xf7768e'
    green:   '0x9ece6a'
    yellow:  '0xe0af68'
    blue:    '0x7aa2f7'
    magenta: '0xbb9af7'
    cyan:    '0x7dcfff'
    white:   '0xa9b1d6'

  bright:
    black:   '0x414868'
    red:     '0xf7768e'
    green:   '0x9ece6a'
    yellow:  '0xe0af68'
    blue:    '0x7aa2f7'
    magenta: '0xbb9af7'
    cyan:    '0x7dcfff'
    white:   '0xc0caf5'

  cursor:
    text: '0x1a1b26'
    cursor: '0xc0caf5'

  selection:
    text: '0xc0caf5'
    background: '0x33467C'

# --- Cursor ---
cursor:
  style: Beam
  unfocused_hollow: true

# --- Scrolling ---
scrolling:
  history: 10000
  multiplier: 3

# --- Key Bindings ---
key_bindings:
  - { key: V, mods: Control|Shift, action: Paste }
  - { key: C, mods: Control|Shift, action: Copy }
  - { key: N, mods: Control|Shift, action: SpawnNewInstance }
