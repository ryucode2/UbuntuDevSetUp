# ===========================
# TMUX FULL CONFIG — CHARACTER-WISE COPY
# ===========================

# ----- TPM Auto-install if missing -----
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins && tmux display-message \"  TPM & plugins installed automatically!\""' \
  'run-shell "tmux display-message \"✅ TPM already present\""' 

# ----- Auto-update plugins (once per day) -----
if-shell '[ ! -f ~/.tmux/.tpm_last_update ] || [ $(date +%s -r ~/.tmux/.tpm_last_update) -lt $(date -d "yesterday" +%s) ]' \
  'run-shell "~/.tmux/plugins/tpm/bin/update_plugins all && touch ~/.tmux/.tpm_last_update && tmux display-message \"🔄 TPM plugins updated\""' 

# ----- TPM Plugins -----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ----- Solarized Dark Palette -----
set -g status on
set -g status-bg colour234
set -g status-fg colour244
set -g status-interval 2
set -g status-left "#[fg=colour33,bold]  #S #[fg=colour244]#[fg=colour64] #(whoami) "
set -g status-right "#[fg=colour244] %Y-%m-%d  %H:%M #[fg=colour37] #(hostname) "
setw -g window-status-format " #[fg=colour244]#I:#W "
setw -g window-status-current-format " #[bg=colour33,fg=colour234,bold] #I:#W #[default] "
set -g pane-border-style fg=colour239
set -g pane-active-border-style fg=colour33
set -g message-style bg=colour234,fg=colour33,bold

# ----- Prefix & reload -----
unbind C-b
set -g prefix C-a
bind C-a send-prefix
unbind r
bind r source-file ~/.tmux.conf \; display-message "  Tmux reloaded!"

# ----- Mouse support -----
set -g mouse on

# ----- Vim-style copy mode -----
setw -g mode-keys vi

# ----- System Clipboard Integration -----
# Copy to system clipboard (y in copy mode)
if-shell 'which pbcopy >/dev/null 2>&1' "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell 'which xclip >/dev/null 2>&1' "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"
if-shell 'which wl-copy >/dev/null 2>&1' "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'"

# Paste from system clipboard (p)
if-shell 'which pbpaste >/dev/null 2>&1' "bind-key p run-shell 'pbpaste | tmux load-buffer - && tmux paste-buffer'"
if-shell 'which xclip >/dev/null 2>&1' "bind-key p run-shell 'xclip -selection clipboard -out | tmux load-buffer - && tmux paste-buffer'"
if-shell 'which wl-paste >/dev/null 2>&1' "bind-key p run-shell 'wl-paste | tmux load-buffer - && tmux paste-buffer'"

# ----- Keyboard selection: character-wise -----
# Usage: C-a [ → move cursor → v → select → y → copy

# ----- Mouse selection: character-wise (tmux >=3.2 + modern terminal) -----
run-shell "tmux -V | awk '{v=substr(\$2,1,1) + 0; if(v<3) system(\"tmux display-message \\\"⚠️ Upgrade tmux to ≥3.2 for mouse character-wise selection\\\"\")}'"

# ----- Neovim integration -----
# In init.vim / init.lua: set clipboard=unnamedplus

# ----- TPM Init (must be last) -----
run -b '~/.tmux/plugins/tpm/tpm'
